# CLA Assistant Lite: checks that every PR author has signed CLA.md.
# Signatures land on the cla-signatures branch, out of main's history.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Exactly the access the action documents as required; contents is write
# because signatures are committed to this repository's cla-signatures
# branch. This pull_request_target workflow never checks out or executes
# PR-controlled code.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/yayamaz/stillpane/blob/main/CLA.md
          branch: cla-signatures
          allowlist: yayamaz,dependabot[bot]
